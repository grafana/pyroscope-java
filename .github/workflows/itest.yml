name: Integration smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: integration-test ${{ matrix.os }} Java ${{ matrix.java_version }}
    runs-on: ubuntu-x64
    strategy:
      fail-fast: false
      matrix:
        os: [alpine-3.22, alpine-3.23, ubuntu-22.04, ubuntu-24.04]
        java_version: ["8", "11", "17", "21", "25"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache-dependency-path: itest/go.mod
      - name: Resolve OS matrix entry
        id: os
        run: |
          os="${{ matrix.os }}"
          distro="${os%%-*}"
          version="${os#*-}"
          echo "dockerfile=${distro}-test.Dockerfile" >> "$GITHUB_OUTPUT"
          echo "image_version=${version}" >> "$GITHUB_OUTPUT"
      - name: Run integration test
        run: go test -v -timeout 30m -count=1 .
        working-directory: itest
        env:
          DOCKERFILE: ${{ steps.os.outputs.dockerfile }}
          IMAGE_VERSION: ${{ steps.os.outputs.image_version }}
          JAVA_VERSION: ${{ matrix.java_version }}
