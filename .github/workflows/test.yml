name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pprof-compatibility:
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 11
          distribution: temurin
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache: false
      - name: Validate encoded profile with Google pprof
        run: |
          ./gradlew :agent:writePprofCompatibilityFixture
          go tool pprof -top agent/build/pprof-compatibility/profile.pb.gz | tee pprof.txt
          grep -q 'leaf' pprof.txt
          grep -q 'shared' pprof.txt
          grep -q 'root' pprof.txt
          go tool pprof -tags agent/build/pprof-compatibility/profile.pb.gz | tee tags.txt
          grep -q 'region' tags.txt
          grep -q 'west' tags.txt

  test:
    runs-on: ${{ matrix.agent }}
    strategy:
      fail-fast: false
      matrix:
        agent: [ubuntu-x64-small, macos-latest]
        java: ['11', '17', '21', '25']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up JDK 21 for Gradle upgrade
        if: ${{ !contains(fromJSON('["11", "17", "21"]'), matrix.java) }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Upgrade Gradle wrapper for newer Java versions
        if: ${{ !contains(fromJSON('["11", "17", "21"]'), matrix.java) }}
        run: ./gradlew wrapper --gradle-version=9.0
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
      - run: ./gradlew test --stacktrace
  javadoc:
    runs-on: ubuntu-x64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: 11
          distribution: 'temurin'
      - run: ./gradlew javaDoc --info
